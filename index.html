    for (let i = 0; i < N; i++) {
      pos.push(i/(N-1)*200, H2Y(DEM.h[j][i]), 200 - j/(N-1)*200);
      uv.push(i/(N-1), j/(N-1));
    }
  }
  for (let j = 0; j < N-1; j++) for (let i = 0; i < N-1; i++) {
    const a = j*N+i, b = a+1, c = a+N, d = c+1;
    idx.push(a, b, c, b, d, c);   // 绕序朝上:法线 +Y, 否则从上看背面被剔除
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
}
const terrainMat = new THREE.MeshStandardMaterial({map:tex, roughness:0.95, metalness:0});
const terrain = new THREE.Mesh(geo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// base slab
const slab = new THREE.Mesh(new THREE.BoxGeometry(200, 2, 200),
  new THREE.MeshStandardMaterial({color:0x2e2a26, roughness:1}));
slab.position.set(100, -1.2, 100);
scene.add(slab);

// ---------- trees ----------
{
  const greens = [0x2e7d32, 0x388e3c, 0x1b5e20, 0x43a047, 0x2f6b2f];
  const canopyGeo = new THREE.IcosahedronGeometry(1, 1);
  const canopyMat = new THREE.MeshStandardMaterial({roughness:1, flatShading:true});
  const canopies = new THREE.InstancedMesh(canopyGeo, canopyMat, TREES.length);
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.32, 1.4, 6);
  const trunkMat = new THREE.MeshStandardMaterial({color:0x5d4037, roughness:1});
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, TREES.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const col = new THREE.Color();
  TREES.forEach((t, k) => {
    const y = H2Y(t.z);
    p.set(t.x, y + 2.1*t.s, 200 - t.y); s.set(1.5*t.s, 1.15*t.s, 1.5*t.s);
    m.compose(p, q, s); canopies.setMatrixAt(k, m);
    col.setHex(greens[k % greens.length]); canopies.setColorAt(k, col);
    p.set(t.x, y + 0.7, 200 - t.y); s.set(1, 1, 1);
    m.compose(p, q, s); trunks.setMatrixAt(k, m);
  });
  canopies.castShadow = true;
  scene.add(canopies); scene.add(trunks);
}

// ---------- landmarks ----------
const RED = 0x8a2323, GOLD = 0xc98f2e;
function pagoda(lm) {
  const g = new THREE.Group();
  const baseY = H2Y(lm.z);
  const tierH = lm.h * 0.85 / lm.tiers;
  let z = 0;
  const plat = new THREE.Mesh(new THREE.CylinderGeometry(lm.r*1.5, lm.r*1.6, lm.h*0.06, 8),
    new THREE.MeshStandardMaterial({color:0x9c8e7a, roughness:1}));
  plat.position.y = lm.h*0.03; plat.castShadow = true; g.add(plat);
  z = lm.h*0.06;
  for (let k = 0; k < lm.tiers; k++) {
    const r = lm.r * (1 - 0.09*k);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r*0.94, r, tierH*0.78, 8),
      new THREE.MeshStandardMaterial({color:RED, roughness:0.85}));
    body.position.y = z + tierH*0.39; body.castShadow = true; g.add(body);
    const eave = new THREE.Mesh(new THREE.CylinderGeometry(r*(lm.eave||1.55), r*(lm.eave||1.55), tierH*0.22, 8),
      new THREE.MeshStandardMaterial({color:GOLD, roughness:0.7}));
    eave.position.y = z + tierH*0.89; eave.castShadow = true; g.add(eave);
    z += tierH;
  }
  const spire = new THREE.Mesh(new THREE.ConeGeometry(lm.r*0.32, lm.h*0.15, 8),
    new THREE.MeshStandardMaterial({color:0xd4af37, roughness:0.4, metalness:0.5}));
  spire.position.y = z + lm.h*0.075; g.add(spire);
  g.position.set(lm.x, baseY, 200 - lm.y);
  return g;
}
function pavilion(lm) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.1, 0.7, 6),
    new THREE.MeshStandardMaterial({color:0x9c8e7a, roughness:1}));
  base.position.y = 0.35; base.castShadow = true; g.add(base);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 2.1, 6),
    new THREE.MeshStandardMaterial({color:0x37474f, roughness:0.8, flatShading:true}));
  roof.position.y = 1.75; roof.castShadow = true; g.add(roof);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8),
    new THREE.MeshStandardMaterial({color:0xd4af37, roughness:0.4, metalness:0.5}));
  tip.position.y = 2.9; g.add(tip);
  g.position.set(lm.x, H2Y(lm.z), 200 - lm.y);
  return g;
}
function pavilionBig(lm) {
  // 城隍阁:方形多层大阁,黄琉璃瓦顶
  const g = new THREE.Group();
  const tierH = lm.h / lm.tiers;
  let z = 0;
  const plat = new THREE.Mesh(new THREE.BoxGeometry(lm.r*2.6, 0.6, lm.r*2.6),
    new THREE.MeshStandardMaterial({color:0x9c8e7a, roughness:1}));
  plat.position.y = 0.3; plat.castShadow = true; g.add(plat);
  z = 0.6;
  for (let k = 0; k < lm.tiers; k++) {
    const w = lm.r*2 * (1 - 0.12*k);
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, tierH*0.72, w),
      new THREE.MeshStandardMaterial({color:0x7a2e2e, roughness:0.85}));
    body.position.y = z + tierH*0.36; body.castShadow = true; g.add(body);
    const eave = new THREE.Mesh(new THREE.BoxGeometry(w*1.4, tierH*0.28, w*1.4),
      new THREE.MeshStandardMaterial({color:0xd4a017, roughness:0.6}));
    eave.position.y = z + tierH*0.86; eave.castShadow = true; g.add(eave);
    z += tierH;
  }
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8),
    new THREE.MeshStandardMaterial({color:0xd4af37, roughness:0.4, metalness:0.5}));
  tip.position.y = z + 0.4; g.add(tip);
  g.position.set(lm.x, H2Y(lm.z), 200 - lm.y);
  return g;
}
function poolTower(lm) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 1.4, 8),
    new THREE.MeshStandardMaterial({color:0x9e9e9e, roughness:1}));
  body.position.y = 0.7; g.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.9, 8),
    new THREE.MeshStandardMaterial({color:0x757575, roughness:1}));
  cap.position.y = 1.85; g.add(cap);
  g.position.set(lm.x, 0.1, 200 - lm.y);
  return g;
}
LANDMARKS.forEach(lm => {
  if (lm.type === 'pagoda') scene.add(pagoda(lm));
  else if (lm.type === 'pavilion') scene.add(pavilion(lm));
  else if (lm.type === 'pavilion_big') scene.add(pavilionBig(lm));
  else if (lm.type === 'pool') scene.add(poolTower(lm));
});

// ---------- labels ----------
function label(text, x, y, z, size=1) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 56px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeText(text, 256, 64);
  ctx.fillStyle = '#1a2a3a'; ctx.fillText(text, 256, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthTest:false}));
  sp.scale.set(20*size, 5*size, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 10;
  scene.add(sp);
}
function L2M(lon, lat) {
  return [ (lon-120.12150)*111320*Math.cos(30.249*Math.PI/180)*0.04,
           (lat-30.22638)*110540*0.04 ];
}
{
  const [lx, ly] = L2M(120.14516, 30.23384);
  label('雷峰塔', lx, H2Y(30)+11, 200-ly);
  const [bx, by] = L2M(120.14337, 30.26334);
  label('保俶塔', bx, H2Y(45)+9, 200-by);
  const [sx, sy] = L2M(120.13903, 30.24033);
  label('三潭印月', sx, 5, 200-sy);
  const [hx, hy] = L2M(120.13965, 30.24857);
  label('湖心亭', hx, 6, 200-hy);
  const [wx, wy] = L2M(120.13900, 30.25000);
  label('西湖', wx, 5, 200-wy, 1.3);
  const [gx, gy] = L2M(120.14600, 30.26500);
  label('宝石山', gx, H2Y(60)+8, 200-gy);
  const [cx2, cy2] = L2M(120.15991, 30.23893);
  label('城隍阁', cx2, H2Y(42)+9, 200-cy2);
}

// ---------- views ----------
const views = {
  se:      {pos:[235,155,285], tgt:[100,0,100]},
  top:     {pos:[100,330,101], tgt:[100,0,100]},
  nw:      {pos:[-35,150,-85], tgt:[100,0,100]},
  leifeng: {pos:[150,55,120],  tgt:[91,4,167]},
  baochu:  {pos:[140,60,20],   tgt:[84,6,37]},
  chenghuang: {pos:[175,45,180], tgt:[148,6,145]},
};
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  const v = views[b.dataset.view];
  camera.position.set(...v.pos); controls.target.set(...v.tgt);
}));
// allow ?view=top|se|nw|leifeng|baochu for screenshots / deep links
{
  const q = new URLSearchParams(location.search).get('view');
  if (q && views[q]) { camera.position.set(...views[q].pos); controls.target.set(...views[q].tgt); }
}
const rotBtn = document.getElementById('rot');
rotBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  rotBtn.textContent = '自动旋转：' + (controls.autoRotate ? '开' : '关');
  rotBtn.classList.toggle('off', !controls.autoRotate);
});
renderer.domElement.addEventListener('pointerdown', () => {
  if (controls.autoRotate) { controls.autoRotate = false;
    rotBtn.textContent = '自动旋转：关'; rotBtn.classList.add('off'); }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
