<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>杭州西湖 · 白色 3D 模型（Cesium）</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.132.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.132.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#cesium{width:100%;height:100%;margin:0;padding:0;overflow:hidden;font-family:sans-serif}
#panel{position:absolute;top:12px;left:12px;z-index:10;background:rgba(10,16,28,.82);color:#e8f0ff;
 padding:12px 14px;border-radius:10px;max-width:340px;font-size:13px;line-height:1.6}
#panel input{width:100%;box-sizing:border-box;padding:6px;margin:6px 0;border-radius:6px;border:1px solid #555;background:#111;color:#fff}
#panel button{margin:2px 4px 2px 0;padding:5px 10px;border:0;border-radius:6px;background:#2f6fed;color:#fff;cursor:pointer}
#panel button.on{background:#e8a13a;color:#222}
#status{color:#9fd6a0;margin-top:6px}</style></head>
<body>
<div id="cesium"></div>
<div id="panel">
 <b>杭州西湖 · 白色 3D 模型</b><br>
 <span style="color:#bcd">谷歌航拍实景的真实几何，以白色模型呈现。粘贴 Cesium ion token 后加载；白模 / 实景可随时切换。</span>
 <input id="token" type="text" placeholder="粘贴 Cesium ion token（只存在你本机浏览器）">
 <button onclick="loadTiles()">加载实景 3D</button>
 <button id="whiteBtn" onclick="toggleWhite()">白模</button>
 <button onclick="fly(120.14516,30.23384,1200)">雷峰塔</button>
 <button onclick="fly(120.14337,30.26334,1200)">保俶塔</button>
 <button onclick="fly(120.15991,30.23893,1200)">城隍阁</button>
 <div id="status">就绪。去 ion.cesium.com 注册免费账号 → My Assets 加 Google Photorealistic 3D Tiles（2275207）→ Access Tokens 建 token 粘贴到这里。</div>
</div>
<script>
const viewer = new Cesium.Viewer('cesium', {
  imageryProvider: new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}),
  terrainProvider: new Cesium.EllipsoidTerrainProvider(),
  baseLayerPicker: false, geocoder: false, homeButton: false,
  timeline: false, animation: false, sceneModePicker: false, navigationHelpButton: false
});
viewer.scene.globe.enableLighting = true;
const defaultSkyBox = viewer.scene.skyBox;
const defaultBaseColor = viewer.scene.globe.baseColor.clone();
let tileset = null, whiteMode = false;

// 白模着色器：去掉照片纹理，全部表面改为纯白，保留光照和阴影，呈现白色 3D 模型效果
const whiteShader = new Cesium.CustomShader({
  fragmentShaderText: `
    void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
      material.diffuse = vec3(1.0, 1.0, 1.0);
    }`
});
function setWhite(on) {
  whiteMode = on;
  const btn = document.getElementById('whiteBtn');
  try {
    if (tileset) tileset.customShader = on ? whiteShader : undefined;
    viewer.scene.globe.baseColor = on ? Cesium.Color.WHITE : defaultBaseColor;
    viewer.scene.backgroundColor = on ? Cesium.Color.fromCssColorString('#e9e9e9') : Cesium.Color.BLACK;
    const layer = (viewer.imageryLayers && viewer.imageryLayers.length > 0) ? viewer.imageryLayers.get(0) : null;
    if (layer) layer.show = !on;                              // 藏起 OSM 2D 底图（若存在）
    if (viewer.scene.skyAtmosphere) viewer.scene.skyAtmosphere.show = !on;
    if (on) { viewer.scene.skyBox = undefined; } else { viewer.scene.skyBox = defaultSkyBox; }
  } catch (err) {
    console.warn('white mode styling failed', err);           // 样式失败也不影响模型加载
  }
  btn.textContent = on ? '实景' : '白模'; btn.classList.toggle('on', on);
}
function toggleWhite() {
  if (!tileset) { document.getElementById('status').textContent = '请先粘贴 token、点“加载实景 3D”，等模型出来再切换白模。'; return; }
  setWhite(!whiteMode);
  document.getElementById('status').textContent = whiteMode ? '白色 3D 模型。点“实景”可切回照片纹理。' : '实景照片纹理。点“白模”可切回白色模型。';
}
function fly(lon, lat, h){ viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(lon, lat, h),
  orientation:{heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-55), roll: 0}, duration: 2}); }
fly(120.1475, 30.249, 6000);
const saved = localStorage.getItem('cesium_ion_token');
if (saved) { document.getElementById('token').value = saved; loadTiles(); }
async function loadTiles(){
  const t = document.getElementById('token').value.trim();
  const st = document.getElementById('status');
  if (!t) { st.textContent = '请先粘贴 token。'; return; }
  localStorage.setItem('cesium_ion_token', t);
  Cesium.Ion.defaultAccessToken = t;
  st.textContent = '正在加载谷歌实景 3D，请稍候…';
  try {
    try { viewer.terrainProvider = await Cesium.createWorldTerrainAsync(); }
    catch (terrErr) { console.warn('world terrain failed, keeping ellipsoid terrain', terrErr); }
    tileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275207);
    viewer.scene.primitives.add(tileset);
  } catch(e){
    st.textContent = '加载失败：' + (e && e.message ? e.message : String(e)) + '。检查 token 是否有效、账号里是否已添加资产 2275207。';
    return;
  }
  setWhite(true);   // 默认就是白色 3D 模型
  st.textContent = '已加载，当前为白色 3D 模型。滚轮缩放、拖动旋转；点“实景”可切回照片纹理。';
  fly(120.1475, 30.249, 2500);
}
</script></body></html>
